spring.application.name=users
server.port=0

eureka.client.serviceUrl.defaultZone=http://localhost:8010/eureka
eureka.instance.instance-id=${spring.application.name}:${spring.application.instance_id:${random.value}}

# mvn spring-boot:run "-Dspring-boot.run.arguments=--spring.application.instance_id=anujPandeySHERR, --server.port=8999"
# mvn spring-boot:run "-Dspring-boot.run.arguments=--spring.application.instance_id=anujPandey"

# H2-DB
spring.datasource.url=jdbc:h2:mem:usersdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=anuj
spring.datasource.password=anuj

# H2-CONSOLE
spring.h2.console.enabled=true
spring.h2.console.settings.web-allow-others=true
spring.h2.console.path=/h2-console

gateway.ip=192.168.1.101